  </defs>
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <circle cx="150" cy="164" r="34" fill="#ff9f0a" filter="url(#glow)"/>
  <circle cx="150" cy="164" r="27" fill="#ff9f0a"/>
  <rect x="210" y="149" width="172" height="30" rx="15" fill="#f2f2f7"/>
  <circle cx="150" cy="256" r="30" fill="#30d158" filter="url(#glow)" opacity="0.55"/>
  <circle cx="150" cy="256" r="22" fill="#30d158"/>
  <rect x="210" y="241" width="132" height="30" rx="15" fill="#48484a"/>
  <circle cx="150" cy="348" r="22" fill="#8e8e93"/>
  <rect x="210" y="333" width="152" height="30" rx="15" fill="#48484a"/>
